name: Release macOS (signed + notarized)

on:
  workflow_dispatch:

jobs:
  build:
    # arm64 only: the AudioCapCLI sidecar is named for aarch64 and llama uses Metal.
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      # Tauri imports the cert into a temp keychain, signs with the hardened runtime,
      # notarizes with notarytool and staples when these are set. Same secrets as notes-assistant-electron.
      - name: Build, sign, notarize
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run tauri build

      - name: Verify signature, notarization, staple
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          APP="$BUNDLE/macos/Scribular.app"
          DMG=$(ls "$BUNDLE"/dmg/*.dmg)
          ls -la "$APP/Contents/Frameworks"
          # Every @rpath dylib the main binary links (llama/ggml) must be in Frameworks, or the app aborts at launch.
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          otool -l "$BIN" | grep -A2 LC_RPATH | grep -F 'path @executable_path/../Frameworks ' >/dev/null
          LIBS=$(otool -L "$BIN" | awk '/@rpath\//{sub("@rpath/","",$1); print $1}')
          grep libllama <<<"$LIBS" >/dev/null
          for lib in $LIBS; do test -f "$APP/Contents/Frameworks/$lib" || { echo "::error::missing Frameworks/$lib"; exit 1; }; done
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/AudioCapCLI"
          codesign -dv --verbose=4 "$APP/Contents/MacOS/AudioCapCLI" 2>&1 | grep 'Authority=Developer ID Application' >/dev/null
          spctl -a -vv "$APP" 2>&1 | tee /dev/stderr | grep "Notarized Developer ID" >/dev/null
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG" || echo "::warning::DMG itself is not stapled (app inside is)"
          du -h "$DMG" | tee -a "$GITHUB_STEP_SUMMARY"

      - uses: actions/upload-artifact@v7
        with:
          name: Scribular-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
