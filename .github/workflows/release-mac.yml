name: Release macOS (signed + notarized)

on:
  workflow_dispatch:
    inputs:
      bump:
        description: Version increment
        type: choice
        options: [patch, minor, major]
        default: patch
        required: true
      publish:
        description: Publish a draft release to scribular-tauri-releases
        type: boolean
        default: false
        required: true
      notes:
        description: Release notes
        type: string
        default: See https://www.scribular.com/releases
        required: true

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - uses: actions/setup-node@v5
        with:
          node-version: 24

      - uses: dtolnay/rust-toolchain@stable

      - run: npm ci

      - name: Bump version
        id: version
        run: |
          VERSION=$(node scripts/bump-version.mjs '${{ inputs.bump }}')
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Check publish target and version
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_REPO: pi0neerpat/scribular-tauri-releases
        run: |
          set -euo pipefail
          test "$RELEASE_REPO" != "pi0neerpat/scribular-releases" || { echo 'Refusing to publish Tauri updates to the Electron feed'; exit 1; }
          test "$GITHUB_REF" = refs/heads/main || { echo 'Publish from main only'; exit 1; }
          test -n "$GH_TOKEN" || { echo 'RELEASES_REPO_TOKEN is required for publish=true'; exit 1; }
          TAG="v$VERSION"
          git ls-remote origin "refs/tags/$TAG" > "$RUNNER_TEMP/tag-check.txt"
          if [ -s "$RUNNER_TEMP/tag-check.txt" ]; then echo "Tag $TAG already exists"; exit 1; fi
          gh release list --repo "$RELEASE_REPO" --limit 1000 --json tagName --jq '.[].tagName' > "$RUNNER_TEMP/release-tags.txt"
          if grep -Fxq "$TAG" "$RUNNER_TEMP/release-tags.txt"; then echo "Release $TAG already exists"; exit 1; fi
          STATUS=$(curl -sS -o "$RUNNER_TEMP/latest.json" -w '%{http_code}' https://github.com/pi0neerpat/scribular-tauri-releases/releases/latest/download/latest.json)
          if [ "$STATUS" = 200 ]; then
            node -e 'const fs=require("node:fs"); const latest=JSON.parse(fs.readFileSync(process.argv[1],"utf8")); const semver=(s)=>s.split(".").map(Number); const a=semver(process.env.VERSION), b=semver(latest.version); if (!(a[0]>b[0] || (a[0]===b[0] && a[1]>b[1]) || (a[0]===b[0] && a[1]===b[1] && a[2]>b[2]))) { console.error(`${process.env.VERSION} must be greater than ${latest.version}`); process.exit(1); }' "$RUNNER_TEMP/latest.json"
          elif [ "$STATUS" != 404 ]; then echo "latest.json request failed with HTTP $STATUS"; exit 1; fi

      - name: Fetch pinned sherpa-onnx macOS runtime
        run: |
          mkdir -p .native
          curl --fail --location --retry 2 https://github.com/k2-fsa/sherpa-onnx/releases/download/v1.13.8/sherpa-onnx-v1.13.8-osx-arm64-shared-lib.tar.bz2 -o .native/sherpa-onnx-v1.13.8-osx-arm64-shared-lib.tar.bz2
          echo 'ae77050cdae565496059d96f5ab33d77b397a0864282a4e4a26e3b3b3effb948  .native/sherpa-onnx-v1.13.8-osx-arm64-shared-lib.tar.bz2' | shasum -a 256 -c

      - name: Build, sign, notarize and sign updater bundle
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE_P12_BASE64 }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_IDENTITY }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_ID_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          SHERPA_ONNX_ARCHIVE_DIR: ${{ github.workspace }}/.native
        run: |
          set -euo pipefail
          npm run tauri build

      - name: Verify signature, notarization, staple and updater bundle
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          set -euo pipefail
          BUNDLE=src-tauri/target/release/bundle
          APP="$BUNDLE/macos/Scribular.app"
          DMG=$(ls "$BUNDLE"/dmg/*.dmg)
          TARBALL="$BUNDLE/macos/Scribular.app.tar.gz"
          ls -la "$APP/Contents/Frameworks"
          BIN="$APP/Contents/MacOS/$(/usr/libexec/PlistBuddy -c 'Print :CFBundleExecutable' "$APP/Contents/Info.plist")"
          otool -l "$BIN" | grep -A2 LC_RPATH | grep -F 'path @executable_path/../Frameworks ' >/dev/null
          LIBS=$(otool -L "$BIN" | awk '/@rpath\//{sub("@rpath/","",$1); print $1}')
          grep libllama <<<"$LIBS" >/dev/null
          grep sherpa-onnx-c-api <<<"$LIBS" >/dev/null
          for lib in $LIBS; do test -f "$APP/Contents/Frameworks/$lib" || { echo "::error::missing Frameworks/$lib"; exit 1; }; done
          ls "$APP/Contents/Frameworks"/libonnxruntime* >/dev/null
          for f in "$APP"/Contents/MacOS/* "$APP"/Contents/Frameworks/*; do
            BAD=$(otool -L "$f" | awk '/^\t/{print $1}' | grep -v -E '^(@rpath/|@executable_path/|@loader_path/|/usr/lib/|/System/)' || true)
            [ -z "$BAD" ] || { echo "::error::$f links outside the bundle: $BAD"; exit 1; }
            ! otool -L "$f" | grep -E 'lib(crypto|ssl)' || { echo "::error::$f links OpenSSL"; exit 1; }
          done
          codesign --verify --deep --strict --verbose=2 "$APP"
          codesign --verify --strict --verbose=2 "$APP/Contents/MacOS/AudioCapCLI"
          codesign -dv --verbose=4 "$APP/Contents/MacOS/AudioCapCLI" 2>&1 | grep 'Authority=Developer ID Application' >/dev/null
          spctl -a -vv "$APP" 2>&1 | tee /dev/stderr | grep "Notarized Developer ID" >/dev/null
          xcrun stapler validate "$APP"
          xcrun stapler validate "$DMG" || echo "::warning::DMG itself is not stapled (app inside is)"
          # The generated archive may predate notarization/stapling; rebuild and re-sign it from the verified app.
          tar -czf "$TARBALL" -C "$(dirname "$APP")" "$(basename "$APP")"
          npx tauri signer sign --app-version "$VERSION" "$TARBALL"
          EXTRACT="$RUNNER_TEMP/updater-app"
          mkdir -p "$EXTRACT"
          tar -xzf "$TARBALL" -C "$EXTRACT"
          codesign --verify --deep --strict "$EXTRACT/Scribular.app"
          spctl -a -vv "$EXTRACT/Scribular.app" 2>&1 | tee /dev/stderr | grep "Notarized Developer ID" >/dev/null
          xcrun stapler validate "$EXTRACT/Scribular.app"
          brew install minisign
          node -e 'const fs=require("node:fs"); const c=JSON.parse(fs.readFileSync("src-tauri/tauri.conf.json")); fs.writeFileSync(process.env.RUNNER_TEMP+"/updater.pub", Buffer.from(c.plugins.updater.pubkey,"base64"))'
          minisign -Vm "$TARBALL" -x "$TARBALL.sig" -p "$RUNNER_TEMP/updater.pub"
          du -h "$DMG" | tee -a "$GITHUB_STEP_SUMMARY"

      - name: Create latest.json
        env:
          RELEASE_NOTES: ${{ inputs.notes }}
        run: node scripts/make-latest-json.mjs "$VERSION" "$RELEASE_NOTES" src-tauri/target/release/bundle/macos/Scribular.app.tar.gz.sig "https://github.com/pi0neerpat/scribular-tauri-releases/releases/download/v$VERSION/Scribular.app.tar.gz" "$RUNNER_TEMP/latest.json"

      - name: Publish updater release
        if: inputs.publish
        env:
          GH_TOKEN: ${{ secrets.RELEASES_REPO_TOKEN }}
          RELEASE_REPO: pi0neerpat/scribular-tauri-releases
          RELEASE_NOTES: ${{ inputs.notes }}
        run: |
          set -euo pipefail
          TAG="v$VERSION"
          BUNDLE=src-tauri/target/release/bundle
          gh release create "$TAG" --repo "$RELEASE_REPO" --draft --title "$TAG" --notes "$RELEASE_NOTES"
          gh release upload "$TAG" "$BUNDLE"/dmg/*.dmg --repo "$RELEASE_REPO"
          gh release upload "$TAG" "$BUNDLE/macos/Scribular.app.tar.gz" "$BUNDLE/macos/Scribular.app.tar.gz.sig" --repo "$RELEASE_REPO"
          gh release upload "$TAG" "$RUNNER_TEMP/latest.json" --repo "$RELEASE_REPO" --clobber
          gh release edit "$TAG" --repo "$RELEASE_REPO" --draft=false

      - name: Commit bump and tag after publish
        if: inputs.publish
        run: |
          set -euo pipefail
          git diff -- src-tauri/Cargo.toml src-tauri/tauri.conf.json package.json > "$RUNNER_TEMP/version-bump.patch"
          git fetch origin main
          git checkout -B main origin/main
          git apply "$RUNNER_TEMP/version-bump.patch"
          git add src-tauri/Cargo.toml src-tauri/Cargo.lock src-tauri/tauri.conf.json package.json
          git -c user.name='github-actions[bot]' -c user.email='41898282+github-actions[bot]@users.noreply.github.com' commit -m "Bump version to $VERSION"
          git tag "v$VERSION"
          git push origin main "v$VERSION"

      - uses: actions/upload-artifact@v7
        with:
          name: Scribular-macos-arm64
          path: src-tauri/target/release/bundle/dmg/*.dmg
