[package]
name = "scribular"
version = "0.1.0"
edition = "2021"
publish = false
# `cargo run` / `tauri dev` start the app, not src/bin/bench.rs.
default-run = "scribular"

[lib]
name = "scribular_lib"

[features]
# KTD9: swaps the speech, LLM and system-audio engines for fakes in tests.
fake-engines = []

# Exact pins per plans/DEPENDENCY_REVIEW_M0.md.
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = "=12.0.1"
# plans/DEPENDENCY_REVIEW_M1.md
rusqlite = { version = "=0.40.2", features = ["bundled"] }
libsqlite3-sys = "=0.38.2"
# plans/DEPENDENCY_REVIEW_M3.md
reqwest = { version = "=0.13.5", default-features = false, features = ["native-tls"] }
sha2 = "=0.10.9"
# plans/DEPENDENCY_REVIEW_ENGINES.md: llama and its ggml link as dylibs
# (fallback A); the sys crate is pinned directly to hold the two-week rule.
llama-cpp-2 = { version = "=0.1.158", default-features = false, features = ["metal", "dynamic-link"] }
llama-cpp-sys-2 = "=0.1.158"
