[package]
name = "scribular"
version = "0.1.0"
edition = "2021"
publish = false

[lib]
name = "scribular_lib"

[features]
# KTD9: swaps the speech, LLM and system-audio engines for fakes in tests.
fake-engines = []

# Exact pins per plans/DEPENDENCY_REVIEW_M0.md.
[build-dependencies]
tauri-build = { version = "=2.7.1", features = [] }

[dependencies]
tauri = { version = "=2.12.1", features = [] }
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
ts-rs = "=12.0.1"
