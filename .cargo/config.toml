[env]
MACOSX_DEPLOYMENT_TARGET = "14.0"
# llama.cpp's common lib links OpenSSL (LLAMA_OPENSSL defaults ON) for model downloads we never use;
# a found Homebrew OpenSSL gets hard-linked by absolute path and the app aborts on Macs without it.
# llama-cpp-sys-2 forwards CMAKE_* env vars to CMake.
CMAKE_DISABLE_FIND_PACKAGE_OpenSSL = "ON"
